name: live smoke test (opt-in)
# Manual only. Makes ONE request per supported ATS to check the public API shape has not changed.
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -W ignore tests/smoke_live.py
